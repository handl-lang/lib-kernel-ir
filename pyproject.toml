[project]
name = "lib-kernel-ir"
version = "0.0.1"
description = "The kernel IR as data: ten ops, grades, costs, torch denotations (ADR-0160/0166)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lib_kernel_ir"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
